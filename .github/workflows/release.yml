name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ─── Windows ────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows (NSIS + Portable)
        run: npm run dist -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist-installer/*.exe
            dist-installer/*.yml
            dist-installer/*.blockmap

  # ─── macOS ─────────────────────────────────────────────────
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS (DMG x64 + arm64)
        run: npm run dist:mac -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No paid Developer ID cert available: leave identity/CSC_* unset so
          # electron-builder falls back to ad-hoc signing (`codesign -s -`).
          # A fully unsigned arm64 app is rejected by Gatekeeper as "damaged" —
          # ad-hoc signing is the free fix. Do NOT set CSC_IDENTITY_AUTO_DISCOVERY=false
          # here, it disables that fallback too.

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist-installer/*.dmg
            dist-installer/*.zip
            dist-installer/*.yml
            dist-installer/*.blockmap

  # ─── Linux ─────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot dpkg

      - name: Install dependencies
        run: npm install

      - name: Build Linux (AppImage + deb)
        run: npm run dist:linux -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.yml
            dist-installer/*.blockmap

  # ─── Android (APK) ────────────────────────────────────────────
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Build mobile web bundle
        run: npm run build:mobile

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Pas de certificat de signature Android (comme pour macOS/Windows,
      # aucun compte payant) : build "debug", installable en activant
      # "Sources inconnues" sur le telephone - Android Studio Play Protect
      # peut avertir a l'installation, c'est attendu pour un APK hors store.
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Rename APK
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/ENT-Studio-${VERSION}.apk"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/debug/ENT-Studio-*.apk

  # ─── Create Release ─────────────────────────────────────────
  release:
    needs: [build-windows, build-mac, build-linux, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ENT Studio v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 🗓️ ENT Studio v${{ steps.version.outputs.VERSION }}

            Suit ton emploi du temps ENT (flux ICS/iCal) et repere a chaque ouverture
            ce qui a change : cours deplace, annule, ajoute ou retire.

            ### 🪟 Windows
            | Fichier | Description |
            |---|---|
            | `ENT-Studio-Setup-*.exe` | Installateur (recommandé) |
            | `ENT-Studio-Portable-*.exe` | Portable — clé USB, aucune installation |

            ### 🍎 macOS
            | Fichier | Description |
            |---|---|
            | `ENT-Studio-*-x64.dmg` | Mac Intel (2020 et avant) |
            | `ENT-Studio-*-arm64.dmg` | Mac Apple Silicon M1/M2/M3/M4 |

            > ⚠️ Première ouverture sur macOS : pas de certificat Apple Developer payant,
            > donc l'app n'est signée qu'en *ad-hoc* → macOS affiche **« ENT Studio est
            > endommagée et ne peut pas être ouverte »** (le clic droit → Ouvrir ne suffit
            > pas ici, contrairement à une vraie app non-notariée). Glisse d'abord l'app
            > dans `/Applications`, puis ouvre **Terminal** et lance :
            > ```
            > xattr -cr "/Applications/ENT Studio.app"
            > ```
            > (Ou double-clique `Fix-macOS-Signature.command` fourni avec le `.dmg`.)

            ### 🐧 Linux
            | Fichier | Description |
            |---|---|
            | `ENT-Studio-*.AppImage` | Universel — toutes les distros |
            | `ENT-Studio-*.deb` | Debian / Ubuntu / Mint |

            ### 🤖 Android
            | Fichier | Description |
            |---|---|
            | `ENT-Studio-*.apk` | A installer directement sur le telephone |

            > Pas de compte Google Play Developer : l'APK n'est pas signe pour un store,
            > juste en debug. Pour l'installer : telecharge le `.apk`, ouvre-le, et
            > autorise "Installer des applications inconnues" si Android le demande
            > (Play Protect peut aussi avertir — normal pour une app hors store).

            ---
            💾 Donnees stockees localement. 🔄 Mises a jour automatiques au demarrage (desktop uniquement — verifie les nouvelles releases manuellement pour l'APK).
          files: dist-artifacts/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
